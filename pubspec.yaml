name: mobile
description: "Smart Home Guardian - aplicativo móvel do TCC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

  # PARTE 6 — integração com o backend:
  http: ^1.2.0                    # chamadas REST (login, ambientes, eventos)
  socket_io_client: ^2.0.3        # alertas em tempo real (WebSocket)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logoSHG.png